[project]
name = "data-science"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "black>=26.5.1",
    "dvc>=3.67.1",
    "evidently>=0.7.21",
    "flake8>=7.3.0",
    "hydra-core>=1.3.6",
    "interrogate>=1.7.0",
    "isort>=9.0.1",
    "kestra>=1.3.0",
    "matplotlib>=3.11.1",
    "mypy>=2.3.1",
    "numpy>=2.4.6",
    "omegaconf>=2.3.1",
    "pandas>=3.0.5",
    "pipe>=2.2",
    "pre-commit>=4.6.2",
    "prefect>=3.8.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
(
    \.git
  | \.venv
  | \.mypy_cache
  | \.pytest_cache
  | build
  | dist
  | notebooks
)
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [".venv", "build", "dist", "notebooks"]
known_first_party = ["src"]
known_third_party = ["pandas", "numpy", "sklearn", "keras", "shap", "bokeh", "ibapi"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = true
ignore-nested-functions = false
ignore-nested-classes = true
ignore-setters = false
fail-under = 80
exclude = ["setup.py", "docs", "build", ".venv", "notebooks", "tests"]
ignore-regex = ["^get$", "^set$", "^_.*", ".*BaseClass.*"]
verbose = 1
quiet = false
whitelist-regex = []
color = true
